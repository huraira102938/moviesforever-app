name = "moviesforever"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Delivers queued push notifications. Free on Cloudflare; ~1,440 tiny runs/day.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[vars]
# Plain-text (non-secret) variables can go here if needed.

# Secrets are set separately via:
#   wrangler secret put FIREBASE_PROJECT_ID
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
